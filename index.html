      border-radius: 50%;

      pointer-events: none;
    }

      0% { transform: translateX(0); }

    }

    /* Carousel */
    .carousel {
      width: 300px;
      height: 200px;
      overflow: hidden;
      border-radius: 0.75rem;
      position: relative;
      margin: 0 auto 1rem;
    }

    .carousel-track {
      display: flex;
      width: max-content;
      animation: slide 120s linear infinite;
    }

      height: 200px;
      object-fit: cover;
      flex-shrink: 0;

  <script>
    const cloudContainer = document.body;
    let speedMultiplier = 1;
    const MAX_SPEED = 4;
    const MIN_SPEED = 0.5;

    function createCloud(startInside = false) {
      const cloud = document.createElement("div");
      cloud.classList.add("cloud");

      // Random size, opacity, and position
      const size = Math.random() * 40 + 100;
      const opacity = Math.random() * 0.4 + 0.6;
      cloud.style.width = `${size}px`;
      cloud.style.height = `${size}px`;
      cloud.style.opacity = opacity;
      cloud.style.top = `${Math.random() * window.innerHeight * 0.8}px`;
      cloud.style.left = startInside ? `${Math.random() * window.innerWidth}px` : `-200px`;

      // Random puffs
      const puffCount = Math.floor(Math.random() * 3) + 4;
      for (let i = 0; i < puffCount; i++) {
        const puff = document.createElement("div");
        const puffSize = size * (0.6 + Math.random() * 0.4);
        puff.style.width = `${puffSize}px`;
        puff.style.height = `${puffSize}px`;
        puff.style.left = `${(Math.random() - 0.5) * size}px`;
        puff.style.top = `${(Math.random() - 0.5) * size * 0.5}px`;
        puff.style.background = "#fff";
        puff.style.borderRadius = "50%";
        puff.style.position = "absolute";
        puff.style.opacity = opacity;
        cloud.appendChild(puff);
      }

      // Random duration
      const duration = Math.random() * 40 + 50;
      cloud.dataset.baseDuration = duration;
      cloud.style.animationDuration = `${duration / speedMultiplier}s`;
      cloudContainer.appendChild(cloud);
      setTimeout(() => cloud.remove(), (duration / speedMultiplier) * 1000);
    }

    for (let i = 0; i < 6; i++) createCloud(true);
    setInterval(() => createCloud(false), 4000);

    window.addEventListener("wheel", (event) => {
      speedMultiplier = Math.min(Math.max(speedMultiplier + (event.deltaY > 0 ? 0.2 : -0.2), MIN_SPEED), MAX_SPEED);
      document.querySelectorAll(".cloud").forEach((cloud) => {
        const base = parseFloat(cloud.dataset.baseDuration);
        cloud.style.animationDuration = `${base / speedMultiplier}s`;
      });
    });
  </script>
